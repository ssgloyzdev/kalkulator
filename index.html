<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Stylish Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at top left, #7c3aed, transparent 35%),
                radial-gradient(circle at bottom right, #06b6d4, transparent 35%),
                #0f172a;
            color: white;
            overflow: hidden;
        }

        .card {
            width: 90%;
            max-width: 500px;
            padding: 45px 35px;
            text-align: center;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            backdrop-filter: blur(15px);

            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);

            animation: muncul 1s ease;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);

            font-size: 35px;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.5);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 12px;

            background: linear-gradient(90deg, #c084fc, #67e8f9);
            -webkit-background-clip: text;
            color: transparent;
        }

        p {
            color: #cbd5e1;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .btn {
            display: inline-block;
            padding: 13px 28px;

            border-radius: 999px;
            border: none;

            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            color: white;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;

            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 10px 30px rgba(6, 182, 212, 0.35);
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #94a3b8;
        }

        @keyframes muncul {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">🚀</div>

        <h1>Halo, Dunia!</h1>

        <p>
            Selamat datang di website kecilku.
            Dibuat dengan HTML dan CSS sederhana,
            tapi tetap tampil stylish.
        </p>

        <button class="btn" onclick="sapa()">
            Klik Aku ✨
        </button>

        <div class="footer">
            Made with HTML + CSS
        </div>

    </div>

    <script>
        function sapa() {
            alert("Halo! 👋 Selamat datang di website ini!");
        }
    </script>

</body>
</html>
